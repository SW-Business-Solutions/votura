appId: de.votura.app
productName: Votura
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'
  # Die NDI-Bindung liegt je Plattform in einem eigenen Paket. `tools/ndi.mjs`
  # legt alle drei bereit, damit auch die Linux-Pakete von diesem Rechner aus
  # entstehen können. Welche mitkommt, entscheiden die Abschnitte `win:` und
  # `linux:` weiter unten — sonst trüge jede Fassung neunzig Megabyte
  # Bindungen für fremde Rechner mit sich.

# Die Bindung ist nativer Code und muss als Datei auf der Platte liegen —
# aus einem Archiv heraus lässt sie sich nicht laden.
asarUnpack:
  - 'node_modules/@grandi/**'
  - 'node_modules/node-gyp-build/**'

# Das Programmsymbol wird zur Laufzeit für die Fenster gebraucht.
extraResources:
  - from: build/icon.png
    to: build/icon.png
  # Das kleine deutsche Sprachmodell für das Mitlaufen nach Gehör am Pult.
  # Es liegt nicht im Repository (rund 45 MB, unveränderlich) und wird vor dem
  # Bauen mit `node tools/sprachmodell.mjs` geholt. Fehlt es, entsteht das
  # Paket trotzdem — dann bleibt „Nach Stimme" ausgegraut, bis jemand in den
  # Einstellungen eines hinterlegt.
  - from: resources/sprachmodell
    to: sprachmodell
    filter:
      - '**/*'

# Kein Update-Server: die Anwendung fragt ausschließlich die öffentlichen
# Veröffentlichungen des Projekts ab, und nur auf ausdrückliche Anforderung.
# Die Angabe hier sorgt dafür, dass beim Bauen eine `latest.yml` mit den
# Prüfsummen entsteht — daran erkennt die Anwendung, ob eine heruntergeladene
# Datei unverändert ist.
publish:
  - provider: github
    owner: SW-Business-Solutions
    repo: votura
    releaseType: release

win:
  # Kein Linux-Paket in der Windows-Fassung.
  files:
    - '!node_modules/@grandi/linux-*/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # Entpackbares Archiv für Rechner, auf denen keine EXE ausgeführt werden darf.
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  icon: build/icon.ico

# Linux: Der Hauptrechner läuft auch dort — der Netzwerkdruck (ESC/POS über
# Port 9100 und Epson ePOS) ist plattformunabhängig; nur der Weg über den
# Windows-Spooler entfällt, und den braucht nur ein per USB angeschlossener
# Drucker.
#
# `tar.gz` ist das Format, das sich überall auspacken lässt und keine
# Paketverwaltung voraussetzt. deb und AppImage entstehen in einer
# Linux-Bauumgebung; sie brauchen Werkzeuge, die es unter Windows nicht gibt.
linux:
  # Kein Windows-Paket in den Linux-Fassungen. Beide Linux-Bauarten (x64
  # und arm64) entstehen in einem Lauf und tragen deshalb beide Bindungen;
  # das ist der Preis dafür, sie nicht einzeln bauen zu müssen.
  files:
    - '!node_modules/@grandi/win32-*/**'
  target:
    - target: tar.gz
      arch: [x64, arm64]
  # Sprechender Name mit Plattform und Architektur: Auf der
  # Veröffentlichungsseite liegen Windows- und Linux-Dateien nebeneinander,
  # und `votura-1.1.0.tar.gz` sagt nicht, wofür es ist.
  artifactName: Votura-${version}-linux-${arch}.${ext}
  category: Office
  synopsis: Software für die Mitgliederversammlung
  description: >-
    Wahlgänge und Stimmzettel, Beamer und Pult — vollständig offline auf einem
    Rechner.
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Votura
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de_DE
  language: '1031'

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
