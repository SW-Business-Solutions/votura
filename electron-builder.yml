appId: de.votura.app
productName: Votura
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# Das Programmsymbol wird zur Laufzeit für die Fenster gebraucht.
extraResources:
  - from: build/icon.png
    to: build/icon.png

# Kein Update-Server: die Anwendung fragt ausschließlich die öffentlichen
# Veröffentlichungen des Projekts ab, und nur auf ausdrückliche Anforderung.
# Die Angabe hier sorgt dafür, dass beim Bauen eine `latest.yml` mit den
# Prüfsummen entsteht — daran erkennt die Anwendung, ob eine heruntergeladene
# Datei unverändert ist.
publish:
  - provider: github
    owner: SW-Business-Solutions
    repo: votura
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # Entpackbares Archiv für Rechner, auf denen keine EXE ausgeführt werden darf.
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-Setup.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Votura
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de_DE
  language: '1031'

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
