# Paketierung der Begleitanwendung „Votura Saal".
#
# Dieselbe Quelle, ein anderer Einstiegspunkt: `out/main/saal.js` statt
# `out/main/index.js`. Beides aus einem Repository zu bauen ist keine
# Bequemlichkeit, sondern Notwendigkeit — die Begleitanwendung zeigt die
# Seiten des Hauptrechners an, und beide müssen dieselben Datenstrukturen
# kennen. Zwei Repositories liefen unweigerlich auseinander.
#
# Das Sprachmodell fehlt hier bewusst: Die Begleitanwendung holt es über das
# Netz vom Hauptrechner. So bleibt sie klein genug, um sie auf ein Tablet oder
# einen alten Saalrechner zu bringen, und ein größeres Modell wird an genau
# einer Stelle hinterlegt.
appId: de.votura.saal
productName: Votura Saal
copyright: Copyright © 2026

extraMetadata:
  main: out/main/saal.js
  name: votura-saal
  productName: Votura Saal

directories:
  output: release-saal
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'
  # Die NDI-Bindung liegt je Plattform in einem eigenen Paket. `tools/ndi.mjs`
  # legt alle drei bereit, damit auch die Linux-Pakete von diesem Rechner aus
  # entstehen können. Welche mitkommt, entscheiden die Abschnitte `win:` und
  # `linux:` weiter unten — sonst trüge jede Fassung neunzig Megabyte
  # Bindungen für fremde Rechner mit sich.

# Die Bindung ist nativer Code und muss als Datei auf der Platte liegen —
# aus einem Archiv heraus lässt sie sich nicht laden.
asarUnpack:
  - 'node_modules/@grandi/**'
  - 'node_modules/node-gyp-build/**'

extraResources:
  - from: build/icon.png
    to: build/icon.png

win:
  # ACHTUNG: Diese Liste **ersetzt** die obige, sie ergänzt sie nicht.
  #
  # Das ist einmal teuer geworden: Hier stand nur die Ausnahme für die fremde
  # NDI-Bindung, und electron-builder packte daraufhin das **ganze Projekt**
  # ein — Quelltext, Tests, Dokumentation und die alten Pakete unter
  # `release-pi`. Aus 190 MB wurden 6,8 GB, und der Quelltext wäre mit
  # ausgeliefert worden.
  #
  # Deshalb steht die Grundliste hier noch einmal vollständig. Wer sie oben
  # ändert, muss sie hier mitändern — `tests/pi.test.ts` wacht darüber.
  files:
    - out/**
    - package.json
    - '!**/*.map'
    # Kein Linux-Paket in der Windows-Fassung.
    - '!node_modules/@grandi/linux-*/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Votura-Saal-${version}-${arch}-Setup.${ext}
  icon: build/icon.ico

# Linux ist für die Begleitanwendung der wichtigere Fall: Beamerrechner im
# Saal und der Raspberry Pi laufen darauf. arm64 deckt Pi 4 und Pi 5 ab —
# beide brauchen dafür ein 64-Bit-System, denn Electron unterstützt kein
# armv7 mehr.
linux:
  # ACHTUNG: Diese Liste **ersetzt** die obige, sie ergänzt sie nicht.
  #
  # Das ist einmal teuer geworden: Hier stand nur die Ausnahme für die fremde
  # NDI-Bindung, und electron-builder packte daraufhin das **ganze Projekt**
  # ein — Quelltext, Tests, Dokumentation und die alten Pakete unter
  # `release-pi`. Aus 190 MB wurden 6,8 GB, und der Quelltext wäre mit
  # ausgeliefert worden.
  #
  # Deshalb steht die Grundliste hier noch einmal vollständig. Wer sie oben
  # ändert, muss sie hier mitändern — `tests/pi.test.ts` wacht darüber.
  files:
    - out/**
    - package.json
    - '!**/*.map'
    # Kein Windows-Paket in den Linux-Fassungen.
    - '!node_modules/@grandi/win32-*/**'
  target:
    - target: tar.gz
      arch: [x64, arm64]
  # Das Einrichtungsskript für den Raspberry Pi lädt genau diesen Namen.
  artifactName: Votura-Saal-${version}-linux-${arch}.${ext}
  category: Utility
  synopsis: Bühne oder Pult für eine Versammlung mit Votura
  description: >-
    Zeigt eine Bühne oder den Prompter eines Votura-Hauptrechners. Findet ihn
    beim Start selbst im Netz.
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Votura Saal
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de_DE
  language: '1031'

portable:
  artifactName: Votura-Saal-${version}-${arch}-portable.${ext}
